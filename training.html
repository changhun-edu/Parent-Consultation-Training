<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학부모 상담 훈련</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0f172a; }

    /* ── 헤더 ──────────────────────────────────── */
    .training-header {
      background: rgba(15,23,42,.97); border-bottom: 1px solid var(--border);
      padding: 12px 20px; position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(8px);
    }
    .training-header__inner {
      max-width: 720px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
    }
    .training-header__info { flex: 1; min-width: 0; }
    .training-header__title {
      font-size: 17px; font-weight: 800; color: var(--txt);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .training-header__meta { font-size: 13px; color: var(--txt3); margin-top: 1px; }

    /* ── 고정 정보 바 (배너 + 감정 바 묶음) ──────── */
    .sticky-info-bar {
      position: sticky;
      top: 58px;           /* training-header 높이 */
      z-index: 90;
      background: #0f172a;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* ── 배너 ──────────────────────────────────── */
    .situation-banner {
      max-width: 720px; margin: 14px auto 0; padding: 12px 16px;
      background: rgba(99,102,241,.07); border: 1px solid rgba(99,102,241,.2);
      border-radius: var(--radius-sm); font-size: 14px; color: var(--txt2); line-height: 1.6;
    }
    @media (max-width: 760px) { .situation-banner { margin-left: 20px; margin-right: 20px; } }
    .situation-banner__label { color: #a5b4fc; font-weight: 700; margin-right: 4px; }

    /* ── 감정 바 ────────────────────────────────── */
    .emotion-wrap { max-width: 720px; margin: 10px auto 0; padding: 0 20px; }

    /* ── 채팅 영역 ──────────────────────────────── */
    .chat-area { max-width: 720px; margin: 0 auto; padding: 24px 20px 48px; }

    /* ── 과거 대화 히스토리 ─────────────────────── */
    .history-exchange { margin-bottom: 20px; opacity: .65; }
    .history-exchange:last-child { margin-bottom: 28px; }

    /* ── 학부모 말풍선 ─────────────────────────── */
    .parent-bubble { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
    .parent-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(239,68,68,.15); border: 2px solid rgba(239,68,68,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .parent-bubble__body {
      max-width: 80%; padding: 13px 16px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px 16px 16px 4px;
      font-size: 16px; line-height: 1.75; color: var(--txt);
    }
    .parent-bubble__name { font-size: 13px; color: var(--txt3); margin-bottom: 4px; font-weight: 600; }

    /* ── 교사 답변 버블 (제출 후) ────────────────── */
    .teacher-bubble {
      display: none; justify-content: flex-end;
      align-items: flex-end; gap: 10px; margin-bottom: 14px;
    }
    .teacher-bubble__body {
      max-width: 80%; padding: 13px 16px;
      background: linear-gradient(135deg, rgba(59,130,246,.18), rgba(99,102,241,.18));
      border: 1px solid rgba(99,102,241,.35);
      border-radius: 16px 16px 4px 16px;
      font-size: 16px; line-height: 1.75; color: var(--txt);
    }
    .teacher-bubble__meta {
      font-size: 13px; margin-top: 6px;
      display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    }
    .teacher-bubble__score { font-weight: 800; font-size: 15px; }
    .teacher-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(99,102,241,.18); border: 2px solid rgba(99,102,241,.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }

    /* ── 입력 영역 ──────────────────────────────── */
    .teacher-input-wrap { margin-bottom: 14px; }
    .teacher-input-label {
      font-size: 14px; color: var(--txt3); font-weight: 600;
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .teacher-input-label span { color: #a5b4fc; }
    #teacher-textarea {
      width: 100%; min-height: 110px;
      background: var(--bg2); border: 1px solid rgba(99,102,241,.3);
      border-radius: var(--radius); padding: 14px 16px;
      color: var(--txt); font-size: 16px; line-height: 1.7;
      resize: vertical; outline: none; font-family: inherit;
      transition: border-color .2s;
    }
    #teacher-textarea:focus { border-color: rgba(99,102,241,.65); }
    #teacher-textarea::placeholder { color: var(--txt3); }
    .teacher-input-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px;
    }
    #char-count { font-size: 14px; color: var(--txt3); }
    .hint-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 10px; }
    .hint-tag {
      font-size: 13px; padding: 3px 10px;
      background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.2);
      border-radius: 12px; color: #a5b4fc; cursor: pointer; transition: all .15s;
    }
    .hint-tag:hover { background: rgba(99,102,241,.18); }
    #submit-btn {
      padding: 10px 22px;
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      border: none; border-radius: var(--radius-sm);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: opacity .2s;
    }
    #submit-btn:hover { opacity: .88; }
    #submit-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── 평가 패널 ──────────────────────────────── */
    .eval-panel {
      display: none; margin-bottom: 12px;
      background: rgba(30,41,59,.7); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .eval-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px; border-bottom: 1px solid var(--border2);
    }
    .eval-header__score { font-size: 36px; font-weight: 900; line-height: 1; }
    .eval-header__grade { font-size: 16px; font-weight: 700; }
    .eval-body { padding: 16px 20px; }
    .eval-item { margin-bottom: 12px; }
    .eval-item:last-child { margin-bottom: 0; }
    .eval-item__header {
      display: flex; justify-content: space-between;
      font-size: 14px; color: var(--txt2); margin-bottom: 4px;
    }
    .eval-item__score { font-weight: 800; font-size: 15px; }
    .eval-bar-track {
      height: 6px; background: rgba(30,41,59,.9);
      border-radius: 3px; overflow: hidden; margin-bottom: 3px;
    }
    .eval-bar-fill { height: 100%; border-radius: 3px; transition: width .9s ease; }
    .eval-hits { font-size: 13px; color: var(--txt3); }
    .eval-feedback {
      margin-top: 12px; padding: 12px 16px;
      background: rgba(245,158,11,.07); border: 1px solid rgba(245,158,11,.2);
      border-radius: var(--radius-sm); font-size: 15px; color: var(--txt2); line-height: 1.7;
    }
    .eval-feedback--good {
      background: rgba(34,197,94,.07); border-color: rgba(34,197,94,.2);
    }
    .eval-fb-item { margin-bottom: 4px; }
    .eval-fb-item:last-child { margin-bottom: 0; }

    /* ── 모범 답변 패널 ─────────────────────────── */
    .model-panel {
      display: none; margin-bottom: 14px;
      background: rgba(99,102,241,.07); border: 1px solid rgba(99,102,241,.25);
      border-radius: var(--radius); padding: 18px 20px;
    }
    .model-panel__label { font-size: 14px; color: #a5b4fc; font-weight: 700; margin-bottom: 10px; }
    .model-panel__text {
      font-size: 16px; line-height: 1.8; color: var(--txt);
      padding: 12px 16px; background: rgba(0,0,0,.2);
      border-radius: var(--radius-sm); border-left: 3px solid var(--indigo);
      margin-bottom: 10px; font-style: italic;
    }
    .model-panel__tip { font-size: 14px; color: var(--txt3); line-height: 1.5; }

    /* ── 다음 버튼 ──────────────────────────────── */
    .next-btn {
      display: none; width: 100%; justify-content: center;
      padding: 13px; margin-bottom: 14px;
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      border: none; border-radius: var(--radius);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; gap: 8px;
    }
    .next-btn:hover { opacity: .9; }

    /* ── 종료 화면 ──────────────────────────────── */
    .end-screen { display: none; padding-bottom: 48px; }
    .end-score-card {
      padding: 28px 24px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 14px; text-align: center;
    }
    .end-emoji   { font-size: 48px; margin-bottom: 6px; display: block; }
    .end-score   { font-size: 62px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
    .end-label-badge {
      display: inline-block; padding: 4px 14px; border-radius: 12px; border: 1px solid;
      font-size: 15px; font-weight: 700; margin-bottom: 14px;
    }
    .end-summary { font-size: 16px; color: var(--txt2); line-height: 1.7; }
    .end-turn-chart {
      display: flex; align-items: flex-end; gap: 6px;
      height: 56px; padding: 0 4px; margin-top: 16px;
    }
    .end-section {
      padding: 14px 18px; border-radius: var(--radius-sm); margin-bottom: 12px;
    }
    .end-section__title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .end-section ul { padding-left: 20px; }
    .end-section li { font-size: 15px; color: var(--txt); line-height: 1.7; margin-bottom: 3px; }
    .end-section--strengths    { background: rgba(34,197,94,.06);  border: 1px solid rgba(34,197,94,.2); }
    .end-section--improvements { background: rgba(245,158,11,.06); border: 1px solid rgba(245,158,11,.2); }
    .end-section--next         { background: rgba(99,102,241,.07); border: 1px solid rgba(99,102,241,.2); }
    .end-section--strengths    .end-section__title { color: #4ade80; }
    .end-section--improvements .end-section__title { color: #fbbf24; }
    .end-section--next         .end-section__title { color: #a5b4fc; }
    .end-next-text { font-size: 16px; color: #a5b4fc; font-weight: 600; line-height: 1.6; }
    .end-btns { display: flex; gap: 10px; }
    .end-btns .btn { flex: 1; justify-content: center; }

    @media (max-width: 480px) {
      .parent-bubble__body, .teacher-bubble__body { max-width: 90%; font-size: 15px; }
      #teacher-textarea { font-size: 15px; }
    }
  </style>
</head>
<body>

<!-- 헤더 -->
<header class="training-header">
  <div class="training-header__inner">
    <a href="index.html" class="btn btn--ghost btn--sm">← 목록</a>
    <div class="training-header__info">
      <div class="training-header__title" id="scenario-title">—</div>
      <div class="training-header__meta">
        <span id="scenario-category" style="font-weight:700"></span>&nbsp;·&nbsp;
        <span id="difficulty-badge" class="badge"></span>&nbsp;·&nbsp;
        <span id="turn-count" style="color:var(--txt3)">1번째 상황</span>
      </div>
    </div>
    <button id="eval-btn" onclick="requestEval()"
      style="padding:7px 14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
             border:none;border-radius:8px;color:#fff;font-size: 14px;font-weight:700;
             cursor:pointer;white-space:nowrap;flex-shrink:0;opacity:.5;pointer-events:none;"
      title="대화를 진행하면 평가받기가 활성화됩니다">
      📊 평가받기
    </button>
  </div>
</header>

<!-- 고정 정보 바 (상황 배너 + 감정 바) -->
<div class="sticky-info-bar">

<div class="situation-banner">
  <span class="situation-banner__label">📌 상황</span>
  <span id="scenario-situation"></span>
</div>

<div class="emotion-wrap">
  <div class="emotion-bar">
    <span class="emotion-bar__label">👩 <span id="parent-name-header">학부모</span> 감정</span>
    <div class="emotion-bar__track">
      <div class="emotion-bar__fill" id="emotion-fill" style="width:70%;background:#f59e0b"></div>
    </div>
    <span class="emotion-bar__text">
      <span id="emotion-label" style="color:var(--yellow)">다소 불안</span>
      &nbsp;<span id="emotion-value" style="color:var(--txt3);font-size: 13px">70</span>
    </span>
  </div>
</div><!-- /emotion-wrap -->
</div><!-- /sticky-info-bar -->

<!-- 채팅 영역 -->
<div class="chat-area container--narrow">

  <!-- 누적 대화 히스토리 -->
  <div id="chat-history-wrap"></div>

  <!-- 학부모 말풍선 -->
  <div class="parent-bubble">
    <div class="parent-avatar">👩</div>
    <div class="parent-bubble__body">
      <div class="parent-bubble__name" id="parent-name-bubble">학부모</div>
      <div id="parent-message">메시지를 불러오는 중…</div>
    </div>
  </div>

  <!-- 교사 답변 버블 (제출 후 표시) -->
  <div class="teacher-bubble" id="teacher-bubble">
    <div class="teacher-bubble__body">
      <div id="teacher-bubble-text"></div>
      <div class="teacher-bubble__meta">
        <span style="font-size: 13px;color:var(--txt3)">내 답변</span>
        <span class="teacher-bubble__score" id="teacher-bubble-score"></span>
      </div>
    </div>
    <div class="teacher-avatar">🧑‍🏫</div>
  </div>

  <!-- 입력 영역 -->
  <div class="teacher-input-wrap" id="teacher-input-wrap">
    <div class="teacher-input-label">
      🧑‍🏫 <span>교사로서 직접 답변을 입력하세요</span>
      <span style="margin-left:auto;font-size: 13px;color:var(--txt3);font-weight:400">Enter 전송 · Shift+Enter 줄바꿈</span>
    </div>

    <!-- 빠른 입력 힌트 -->
    <div class="hint-tags">
      <span class="hint-tag" onclick="insertHint('많이 놀라셨겠어요.')">💛 많이 놀라셨겠어요</span>
      <span class="hint-tag" onclick="insertHint('충분히 이해합니다.')">🤝 충분히 이해합니다</span>
      <span class="hint-tag" onclick="insertHint('확인 후 연락드리겠습니다.')">📅 확인 후 연락</span>
      <span class="hint-tag" onclick="insertHint('함께 방법을 찾아보겠습니다.')">🔧 함께 방법을</span>
    </div>

    <textarea id="teacher-textarea"
      placeholder="학부모에게 어떻게 응답하시겠습니까?&#10;&#10;예시) 어머니, 많이 놀라셨겠어요. 상황을 확인해보고 오늘 중으로 연락드리겠습니다."
      rows="4"></textarea>
    <div class="teacher-input-footer">
      <span id="char-count">0자</span>
      <button id="submit-btn" onclick="submitResponse()">전송 ↵</button>
    </div>
  </div>

  <!-- 평가 패널 -->
  <div class="eval-panel" id="eval-panel">
    <div class="eval-header">
      <div>
        <div class="eval-header__score" id="eval-total">0점</div>
        <div class="eval-header__grade" id="eval-grade"></div>
      </div>
      <!-- 미니 막대 -->
      <div style="flex:1;margin-left:16px">
        <div style="height:8px;background:rgba(30,41,59,.9);border-radius:4px;overflow:hidden">
          <div id="eval-total-bar" style="height:100%;border-radius:4px;transition:width 1s ease"></div>
        </div>
      </div>
    </div>
    <div class="eval-body">
      <div id="eval-breakdown"></div>
      <div class="eval-feedback" id="eval-feedback" style="display:none"></div>
    </div>
  </div>

  <!-- 모범 답변 패널 -->
  <div class="model-panel" id="model-panel">
    <div class="model-panel__label">💬 모범 답변</div>
    <div class="model-panel__text" id="model-text"></div>
    <div class="model-panel__tip" id="model-tip"></div>
  </div>

  <!-- 다음 버튼 -->
  <button class="next-btn btn" id="next-btn">다음 상황으로 →</button>

  <!-- 종료 화면 -->
  <div class="end-screen" id="end-screen">
    <div class="end-score-card">
      <span class="end-emoji" id="end-emoji">🌟</span>
      <div class="end-score" id="end-score">—</div>
      <div><span class="end-label-badge" id="end-label-badge">—</span></div>
      <p class="end-summary" id="end-summary"></p>
      <!-- 레이더 차트 -->
      <div id="radar-wrap" style="margin:22px auto 0;max-width:300px;border-top:1px solid var(--border2);padding-top:20px">
        <div style="font-size: 13px;font-weight:700;color:var(--txt3);letter-spacing:.06em;margin-bottom:10px;text-align:center">📊 항목별 상담 역량</div>
        <svg id="radar-svg" viewBox="-145 -145 290 290" style="width:100%;height:auto;display:block;"></svg>
      </div>
      <!-- 턴별 점수 차트 -->
      <div class="end-turn-chart" id="end-turn-chart"
           style="justify-content:center;border-top:1px solid var(--border2);margin-top:20px;padding-top:16px"></div>
    </div>

    <!-- 턴별 모범 답변 비교 -->
    <div id="end-model-section"
         style="background:rgba(30,41,59,.7);border:1px solid var(--border);
                border-radius:var(--radius);padding:16px 20px;margin-bottom:12px">
    </div>

    <div class="end-section end-section--strengths" id="end-strengths-section">
      <div class="end-section__title">✅ 잘한 점</div>
      <ul id="end-strengths-list"></ul>
    </div>
    <div class="end-section end-section--improvements" id="end-improvements-section">
      <div class="end-section__title">📝 개선할 점</div>
      <ul id="end-improvements-list"></ul>
    </div>
    <div class="end-section end-section--next">
      <div class="end-section__title">🎯 다음 연습 포인트</div>
      <div class="end-next-text" id="end-next-practice"></div>
    </div>

    <div class="end-btns">
      <button class="btn btn--ghost" onclick="restartScenario()">🔄 다시 연습</button>
      <a href="index.html" class="btn btn--primary">🏠 다른 시나리오</a>
    </div>
  </div>

</div><!-- /chat-area -->

<script>
/* =====================================================
   training.js  –  채팅형 다회차 상담 훈련
   
   대화 흐름:
     학부모 발화 → 교사 입력(Enter) → 다음 학부모 발화
     → ... → 모든 대화 끝나면 자동 전체 평가
   
   평가받기 버튼:
     대화 중 언제든 클릭 → 지금까지의 전체 평가
   
   API 없음 - JSON 저장 대화 + 키워드 자동 평가
   ===================================================== */

const DIFFICULTY_LABEL = { 1:'⭐ 초급', 2:'⭐⭐ 중급', 3:'⭐⭐⭐ 고급' };

/* ── 평가 루브릭 ───────────────────────────────────── */
const RUBRIC = [
  { key:'empathy',   label:'공감 표현', icon:'💛', max:30, perHit:12,
    words:['많이','충분히','이해합니다','이해해요','걱정','마음이','속상',
           '놀라셨겠','안타깝','힘드셨겠','당황하셨겠','그러셨겠','아쉬우셨',
           '서운하셨겠','힘들었겠','속상하셨겠','충분히 이해','죄송'] },
  { key:'solution',  label:'해결 방향', icon:'🔧', max:25, perHit:9,
    words:['확인','살펴보','이야기 나누','알려드리','연락드리','방법을','조치',
           '지도하겠','함께','노력','챙기겠','처리하겠','파악하겠','점검'] },
  { key:'fact',      label:'사실 기반', icon:'📋', max:20, perHit:8,
    words:['직접','확인했','상황을','당시','기록','목격','제가 보','처치','양호실'] },

어떤 작은 부상이라도 즉시 연락드리겠습니다.","tip":"💡 학부모의 지적을 충분히 인정하고, 앞으로의 약속을 명확히 하세요."},{"parentMessage":"M 상태는 지금 어떤가요? 병원에 가봐야 하는 건 아닌지.","modelAnswer":"양호실에서 확인했을 때는 찰과상으로 처치 후 정상적으로 활동했습니다. 그래도 어머니께서 걱정되신다면 오늘 저녁에 병원에서 확인해 보시는 게 좋겠습니다. 만약 치료가 필요하시면 학교 안전공제회를 통해 의료비 지원을 받으실 수 있으니 필요하시면 제가 안내해 드리겠습니다.","tip":"💡 학부모가 궁금한 정보를 충분히 제공하고, 실질적 지원 방법까지 안내하세요."},{"parentMessage":"앞으로는 이런 일이 생기면 꼭 바로 연락 주세요. 제가 모르고 있으면 너무 불안하거든요.","modelAnswer":"네, 꼭 그렇게 하겠습니다. 앞으로 부상이 생기면 아무리 작은 것도 바로 문자로 알려드리겠습니다. 어머니께서 항상 M 상태를 파악하실 수 있도록 제가 더 세심하게 소통하겠습니다.","tip":"💡 구체적인 방법(문자)과 기준(작은 부상도)을 명시해 신뢰를 주세요."},{"parentMessage":"감사합니다. M이 지금은 크게 아파하지 않으니 다행이에요.","modelAnswer":"다행입니다. M이 내일 학교에서 불편함 없이 잘 지내는지 제가 살펴보겠습니다. 혹시 집에서 불편해하면 바로 알려주세요. 먼저 연락해 주셔서 감사합니다.","tip":"💡 마무리에는 내일 학교에서의 모니터링을 약속해 지속적 관심을 보여주세요."},{"parentMessage":"그런데 선생님, 다른 학부모님들도 이런 상황에서 연락을 못 받으신 경우가 있나요? 학교 차원에서 매뉴얼 같은 게 있는 건가요?","modelAnswer":"좋은 질문입니다, 어머니. 학교 안전사고 대응 매뉴얼상 양호실 처치가 필요한 경우 보호자에게 연락하도록 되어 있습니다. 이번에 제가 그 절차를 지키지 못한 것입니다. 앞으로는 매뉴얼대로 처치 즉시 연락드리겠습니다.","tip":"💡 학교 절차를 정확히 안내하고, 이번에 그 절차를 따르지 못했음을 솔직히 인정하세요."},{"parentMessage":"체육 시간에 아이들이 다치는 게 잦은 건 아닌가요? 안전 관리를 더 철저하게 할 방법은 없나요?","modelAnswer":"어머니, 좋은 지적입니다. 체육 시간 전 준비운동을 철저히 하고, 위험한 동작은 제가 직접 시범을 보인 뒤 진행하고 있습니다. 이번 사고처럼 예상치 못한 상황도 있지만, 앞으로는 운동장 상태 점검과 안전 구역 표시를 더 꼼꼼히 확인하겠습니다.","tip":"💡 현재 하고 있는 안전 조치를 설명하고, 추가 개선 방향을 함께 제시하세요."},{"parentMessage":"혹시 M이 특별히 조심해야 할 신체적인 부분이 있는데 선생님이 알고 계세요? 건강 조사서에 적었던 것 같은데요.","modelAnswer":"네, M의 건강 조사서를 확인했고 알고 있습니다. 체육 활동 시 해당 부분을 더욱 주의 깊게 살피겠습니다. 혹시 최근에 변경된 내용이 있으시면 알려주시면 바로 반영하겠습니다.","tip":"💡 아이의 건강 정보를 파악하고 있음을 확인시켜 주고, 최신 정보 업데이트를 요청하세요."},{"parentMessage":"선생님이 꼼꼼하게 챙겨주시는 것 같아서 안심이 돼요. 앞으로 궁금한 게 있으면 편하게 연락해도 될까요?","modelAnswer":"물론입니다, 어머니. 언제든지 문자나 전화로 연락 주세요. M의 건강과 안전에 관한 일이라면 아무리 작은 것이라도 함께 챙겨나가면 좋겠습니다. 오늘 이야기해 주셔서 감사합니다.","tip":"💡 언제든 연락 가능하다는 개방성을 보여주고, 협력 관계를 공고히 하며 마무리하세요."}],"teachingPoint":"부상 발생 시 즉각 연락이 원칙입니다. 사과를 먼저 하고, 앞으로의 구체적 조치를 약속해야 신뢰가 회복됩니다.","strengths":["즉각적 사과와 실수 인정","안전공제회 안내로 실질적 도움 제공"],"improvements":["부상 발생 즉시 연락하는 습관","보건 처치 내용을 귀가 전 확인 문자 발송"]},{"id":"s4","scenarioType":"고난도","typeLabel":"고난도 민원","typeColor":"#ef4444","category":"교사 태도","categoryIcon":"🧑‍🏫","categoryColor":"#ef4444","title":"차별 대우 의심","difficulty":3,"situation":"6학년 담임입니다. K의 어머니가 선생님이 자신의 아이만 유독 차별한다고 주장합니다. 교사는 특별히 차별한 적이 없다고 생각합니다.","parentName":"K 어머니","initialEmotion":83,"turns":[{"parentMessage":"선생님, K 엄마예요. 솔직히 말씀드릴게요. 우리 아이가 선생님한테 차별받는다고 느끼고 있어요. 다른 아이들이랑 대우가 다르다고요. 이게 사실인지 여쭤보고 싶어서요.","modelAnswer":"어머니, 그렇게 느끼셨다면 많이 속상하셨을 것 같습니다. K도 그런 마음을 가지고 있었다면 저도 꼭 확인해 봐야 할 부분이라고 생각합니다. 제가 의도적으로 K를 차별한 적은 없지만, K가 그렇게 느낀 구체적인 상황이 있었는지 먼저 자세히 들어봐도 될까요?","tip":"💡 즉각 부정하지 말고, 공감 후 구체적 상황을 먼저 파악하려는 자세를 보여주세요."},{"parentMessage":"아이가 집에 와서 자꾸 말해요. 발표할 때도 자기는 잘 안 시켜주고, 친구들이 떠들 때는 그냥 넘어가는데 자기만 혼난다고요. 그러니까 아이가 선생님이 자기를 싫어한다고 느끼는 것 같아요.","modelAnswer":"K가 그렇게 느꼈다면 그냥 넘길 일은 아닌 것 같습니다. 말씀해 주신 발표 기회나 생활지도 상황을 제가 다시 돌아보겠습니다. 제가 기억하기로는 발표는 여러 학생에게 기회를 주려고 했고, 생활지도도 특정 학생만을 대상으로 하지 않았습니다. 그래도 K가 반복해서 그렇게 느꼈다면 제 지도 방식이 K에게 어떻게 받아들여졌는지 확인해 볼 필요가 있습니다.","tip":"💡 아이의 감정을 인정하면서도, 객관적 사실을 차분하게 설명하세요."},{"parentMessage":"선생님은 그렇게 생각하실 수 있겠지만, 아이 입장에서는 다르게 느끼는 거잖아요. 아이가 학교 가기 싫다고까지 말하니까 저도 그냥 넘길 수가 없어요.","modelAnswer":"어머니 말씀처럼 아이가 학교 가기 싫다고까지 말했다면 저도 매우 중요하게 봐야 할 상황입니다. 먼저 K와 편안하게 이야기해 보면서 어떤 장면에서 서운함을 느꼈는지 확인하겠습니다. 그리고 수업 중 발표 기회나 생활지도 상황도 제가 다시 점검해 보겠습니다.","tip":"💡 '학교 가기 싫다'는 말의 심각성을 받아들이고, 구체적인 확인 계획을 제시하세요."},{"parentMessage":"저는 선생님을 탓하려고만 전화드린 건 아니에요. 그런데 아이가 계속 힘들다고 하니까, 선생님이 조금만 더 신경 써주셨으면 좋겠어요.","modelAnswer":"네, 어머니 말씀 충분히 이해합니다. 앞으로 K가 수업에서 소외감을 느끼지 않도록 발표 기회나 역할 부여를 더 세심하게 살피겠습니다. 생활지도 때도 K가 억울하게 느끼지 않도록 이유를 분명히 설명하고, 필요하면 따로 불러 차분히 이야기하겠습니다. 이번 주 안에 K와 한 번 이야기해 보고, 확인한 내용을 어머니께 다시 말씀드리겠습니다.","tip":"💡 학부모가 원하는 것을 파악하고, 구체적이고 실행 가능한 개선 계획을 제시하세요."},{"parentMessage":"그렇게 해주시면 좋겠어요. 아이가 선생님이 자기를 싫어한다고 생각하는 게 제일 걱정이에요.","modelAnswer":"K가 그렇게 느끼고 있었다면 저도 마음이 무겁습니다. 저는 K를 싫어하거나 차별하려는 마음은 전혀 없습니다. 다만 제 말이나 지도 방식이 K에게 다르게 받아들여졌을 수 있다는 점은 조심해서 살펴보겠습니다. K가 학교에서 안심하고 지낼 수 있도록 제가 더 세심하게 챙기겠습니다.","tip":"💡 교사로서의 진심을 전달하되, 자기 성찰의 자세를 함께 보여주세요."},{"parentMessage":"네, 선생님이 그렇게 말씀해 주시니 조금 안심이 됩니다. 아이하고도 잘 이야기해 주세요.","modelAnswer":"네, 어머니. K와 이야기할 때 아이가 부담을 느끼지 않도록 조심스럽게 확인하겠습니다. 확인 후에 어머니께 다시 연락드리겠습니다. 말씀해 주셔서 감사합니다.","tip":"💡 아이를 배려하는 구체적 방법과 후속 연락을 약속하며 마무리하세요."},{"parentMessage":"솔직히 말씀드리면, 다른 학부모님들한테서도 선생님이 특정 아이들을 편애한다는 말을 들은 적이 있어요. 저한테만 이런 일이 생긴 게 아닐 수도 있다는 거죠.","modelAnswer":"그런 이야기를 들으셨군요. 많이 마음이 불편하셨을 것 같습니다. 다른 학부모님들의 우려도 제가 가볍게 여기지 않겠습니다. 특정 학생을 편애하거나 차별하려는 의도는 없었지만, 제 행동이 그렇게 비칠 수 있다면 저도 더 많이 돌아봐야 할 것 같습니다. K뿐 아니라 모든 학생이 공평하게 대우받을 수 있도록 더 세심히 노력하겠습니다.","tip":"💡 소문에 방어적으로 반응하지 않고, 다른 학부모들의 의견도 진지하게 수용하는 자세를 보여주세요."},{"parentMessage":"제가 학교에 공식으로 민원을 넣어야 하나 고민이에요. 아이가 계속 힘들다고 하니까요.","modelAnswer":"어머니께서 그런 고민을 하실 정도라면 K가 얼마나 힘들어하고 있는지 더 진지하게 받아들여야겠습니다. 민원을 제기하실 권리는 언제나 있습니다. 다만 그 전에 저와 직접 이야기를 더 나누시거나, 필요하다면 학교 상담사 선생님과 함께하는 3자 면담을 마련해 드릴 수 있습니다. 어떤 방식이 도움이 될지 어머니가 선택해 주세요.","tip":"💡 민원 제기를 막거나 방어하지 않고, 더 나은 해결 방법을 함께 찾으려는 자세를 보여주세요."},{"parentMessage":"민원이 들어가면 선생님 입장에서도 불편하실 것 같아서 제가 망설이고 있어요. 하지만 아이 문제니까 어쩔 수 없는 것 같기도 하고요.","modelAnswer":"어머니, 저를 배려해 주시는 마음 감사합니다. 하지만 K가 학교에서 행복하게 지내는 것이 저의 불편함보다 훨씬 더 중요합니다. 어머니께서 어떤 방식으로 해결하려 하시든 저는 성실하게 협력하겠습니다.","tip":"💡 학부모의 배려에 감사하되, 아이를 최우선에 두는 교사의 가치관을 분명히 전달하세요."},{"parentMessage":"그럼 어떤 구체적인 변화가 있을지 제가 어떻게 확인할 수 있을까요?","modelAnswer":"이번 주 안에 K와 이야기를 나누고, 다음 주 중으로 어머니께 전화드려 상황을 공유하겠습니다. 그 후에도 2주에 한 번씩 짧게라도 K의 상황을 알려드리겠습니다. 만약 제가 전달드린 내용과 K가 집에서 이야기하는 내용이 다르다면 바로 연락 주세요.","tip":"💡 구체적인 확인 일정과 소통 방식을 약속하면 학부모의 불안이 크게 줄어듭니다."},{"parentMessage":"K가 선생님한테 직접 말하기는 많이 힘들어할 것 같아요. 아이가 부담을 느끼지 않도록 해주실 수 있나요?","modelAnswer":"충분히 이해합니다. K에게 먼저 다가갈 때는 직접적으로 물어보기보다 자연스러운 대화 중에 이야기를 들을 수 있도록 하겠습니다. 1대1로 차분하게 이야기할 수 있는 시간과 공간을 만들어 아이가 편하게 이야기할 수 있게 배려하겠습니다.","tip":"💡 아이의 심리적 안전감을 위한 구체적인 접근 방식을 설명하세요."},{"parentMessage":"네, 선생님. 오늘 솔직하게 이야기 나눠서 좋았어요. 저도 집에서 K한테 선생님에 대해 긍정적으로 이야기해볼게요.","modelAnswer":"어머니, 감사합니다. 오늘 이렇게 직접 말씀해 주신 덕분에 저도 많이 돌아볼 수 있었습니다. K가 학교에서 안심하고 지낼 수 있도록 최선을 다하겠습니다. 가정에서의 따뜻한 지지가 아이에게 큰 힘이 될 것입니다. 언제든지 연락 주세요.","tip":"💡 학부모의 협력에 진심으로 감사하고, 가정의 역할을 격려하며 긍정적으로 마무리하세요."}],"teachingPoint":"차별 주장에 즉각 부정하지 않고, 아이의 감정을 인정한 뒤 구체적 확인과 개선을 약속하는 것이 핵심입니다.","strengths":["방어하지 않고 경청하는 자세","구체적 개선 계획과 후속 연락 약속"],"improvements":["평소 발표 기회 기록 관리","생활지도 시 이유 설명 습관화"]}]};
    state.scenario = data.scenarios.find(s => s.id === id);
  } catch { showError('데이터를 불러오지 못했습니다.'); return; }

  if (!state.scenario) { location.href = 'index.html'; return; }

function applyMeta() {
  const s = state.scenario;
  document.title = `${s.title} – 학부모 상담 훈련`;
  setText('scenario-title',     s.title);
  setText('scenario-category',  s.categoryIcon + ' ' + s.category);
  setText('scenario-situation', s.situation);
  setText('parent-name-header', s.parentName);
  setText('parent-name-bubble', s.parentName);
  $('scenario-category').style.color = s.categoryColor;
  const db = $('difficulty-badge');
  db.className   = `badge badge--d${s.difficulty}`;
  db.textContent = DIFFICULTY_LABEL[s.difficulty];
}

/* ════════════════════════════════════════════════════
   현재 턴 렌더링
   ════════════════════════════════════════════════════ */
function renderTurn() {
  const turn = state.scenario.turns[state.turnIndex];
  if (!turn) { showEndScreen(); return; }

  updateProgress();

  // 학부모 메시지
  const msgEl = $('parent-message');
  msgEl.classList.remove('anim-fade-in');
  void msgEl.offsetWidth;
  msgEl.textContent = turn.parentMessage;
  msgEl.classList.add('anim-fade-in');

  // 이전 응답 관련 패널 모두 숨기기
  $('eval-panel').style.display     = 'none';
  $('model-panel').style.display    = 'none';
  $('next-btn').style.display       = 'none';
  $('teacher-bubble').style.display = 'none';

  state.phase = 'input';
  showInputArea();
}

/* ════════════════════════════════════════════════════
   입력 영역
   ════════════════════════════════════════════════════ */
function showInputArea() {
  const wrap = $('teacher-input-wrap');
  wrap.style.display = 'block';
  wrap.classList.remove('anim-fade-in');
  void wrap.offsetWidth;
  wrap.classList.add('anim-fade-in');

  const ta = $('teacher-textarea');
  ta.value = '';
  ta.style.borderColor = '';
  ta.rows = 2;
  updateCharCount();
  $('submit-btn').disabled = false;
  setTimeout(() => ta.focus(), 200);
}

function updateCharCount() {
  const len = $('teacher-textarea').value.length;
  const el  = $('char-count');
  el.textContent = `${len}자`;
  el.style.color = len < 10 ? 'var(--txt3)' : 'var(--green)';
}

function insertHint(text) {
  const ta  = $('teacher-textarea');
  const val = ta.value;
  ta.value  = val + (val && !val.endsWith(' ') ? ' ' : '') + text;
  ta.focus();
  updateCharCount();
}

/* ════════════════════════════════════════════════════
   답변 전송 → 즉시 다음 대화로
   ════════════════════════════════════════════════════ */
function submitResponse() {
  if (state.phase !== 'input') return;
  const text = $('teacher-textarea').value.trim();
  if (text.length < 3) {
    $('teacher-textarea').style.borderColor = 'var(--red)';
    $('teacher-textarea').focus();
    return;
  }

  state.phase = 'transitioning';
  $('submit-btn').disabled = true;
  $('teacher-input-wrap').style.display = 'none';

  // 점수 계산 (배경 처리, 화면에 즉시 표시 안 함)
  const turn   = state.scenario.turns[state.turnIndex];
  const score  = evaluateInput(text, turn);
  state.allScores.push(score);
  state.turnHistory.push({ parentMsg: turn.parentMessage, teacherInput: text, score });

  // 감정 바만 업데이트
  const delta = score >= 70 ? -18 : score >= 40 ? 3 : 14;
  state.emotionLevel = Math.max(5, Math.min(100, state.emotionLevel + delta));
  updateEmotionBar(state.emotionLevel, false);

  // 평가받기 버튼 활성화 (1턴 이상 완료 시)
  activateEvalBtn();

  // 히스토리에 현재 교환 추가
  appendToHistory(turn.parentMessage, text, score);

  // 마지막 턴이면 전체 평가로
  const isLast = state.turnIndex >= state.totalTurns - 1;
  if (isLast) {
    // 잠깐 딜레이 후 결과 표시
    setTimeout(() => showEndScreen(), 600);
  } else {
    // 다음 턴으로
    state.turnIndex++;
    setTimeout(() => {
      renderTurn();
      // 새 학부모 메시지로 스크롤
      const bubble = document.querySelector('.parent-bubble:not(.history-exchange .parent-bubble)');
      if (bubble) bubble.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 400);
  }
}

/* ════════════════════════════════════════════════════
   대화 히스토리에 직접 추가 (채팅창에 누적)
   ════════════════════════════════════════════════════ */
function appendToHistory(parentMsg, teacherInput, score) {
  var wrap  = $('chat-history-wrap');
  var scCol = score >= 80 ? '#22c55e' : score >= 60 ? '#3b82f6' : score >= 40 ? '#f59e0b' : '#ef4444';
  var html  = '';

  /* 학부모 버블 */
  html += '<div class="parent-bubble">';
  html += '<div class="parent-avatar" style="width:32px;height:32px;font-size: 17px">\uD83D\uDC69</div>';
  html += '<div class="parent-bubble__body" style="font-size: 15px">';
  html += '<div class="parent-bubble__name" style="font-size: 12px">' + escHtml(state.scenario.parentName) + '</div>';
  html += escHtml(parentMsg);
  html += '</div></div>';

  /* 교사 버블 */
  html += '<div class="teacher-bubble" style="display:flex">';
  html += '<div class="teacher-bubble__body" style="font-size: 15px">';
  html += '<div>' + escHtml(teacherInput) + '</div>';
  html += '<div class="teacher-bubble__meta">';
  html += '<span style="font-size: 12px;color:#8294a7">내 답변</span>';
  html += '<span style="font-weight:800;font-size: 14px;color:' + scCol + '">' + score + '점</span>';
  html += '</div></div>';
  html += '<div class="teacher-avatar" style="width:32px;height:32px;font-size: 17px">\uD83E\uDDD1\u200D\uD83C\uDFEB</div>';
  html += '</div>';

  var div = document.createElement('div');
  div.className = 'history-exchange anim-fade-in';
  div.innerHTML = html;
  wrap.appendChild(div);
}

/* ════════════════════════════════════════════════════
   키워드 자동 평가
   ════════════════════════════════════════════════════ */
function evaluateInput(text, turn) {
  let total = 0;
  for (const cfg of RUBRIC) {
    const hits = cfg.words.filter(w => text.includes(w));
    const raw  = Math.min(Math.abs(cfg.max), hits.length * Math.abs(cfg.perHit));
    total += cfg.penalty ? -raw : raw;
  }
  if (text.length < 20) total = Math.floor(total * 0.6);
  return Math.max(0, Math.min(100, total));
}

/* ════════════════════════════════════════════════════
   평가받기 버튼 (헤더)
   ════════════════════════════════════════════════════ */
function activateEvalBtn() {
  const btn = $('eval-btn');
  if (!btn) return;
  btn.style.opacity       = '1';
  btn.style.pointerEvents = 'auto';
  btn.title               = '지금까지의 전체 상담을 평가합니다';
}

function requestEval() {
  if (state.turnHistory.length === 0) return;
  // 현재 입력 중인 내용이 있으면 먼저 전송
  const text = $('teacher-textarea').value.trim();
  if (state.phase === 'input' && text.length >= 3) {
    submitResponse();
    // submitResponse 내부에서 isLast 여부에 따라 showEndScreen 호출됨
    return;
  }
  showEndScreen();
}

/* ════════════════════════════════════════════════════
   전체 평가 화면
   ════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════
   항목별 점수 계산 (0-100%)
   ════════════════════════════════════════════════════ */
function evaluateCategories(text) {
  var result = { empathy: 0, solution: 0, fact: 0, followup: 0 };
  for (var i = 0; i < RUBRIC.length; i++) {
    var cfg = RUBRIC[i];
    if (cfg.penalty) continue;
    var hits = 0;
    for (var j = 0; j < cfg.words.length; j++) {
      if (text.includes(cfg.words[j])) hits++;
    }
    var earned = Math.min(cfg.max, hits * cfg.perHit);
    result[cfg.key] = cfg.max > 0 ? Math.round((earned / cfg.max) * 100) : 0;
  }
  return result;
}

/* ════════════════════════════════════════════════════
   레이더 차트 (SVG)
   ════════════════════════════════════════════════════ */
function drawRadarChart(scores) {
  var R    = 100;
  var axes = [
    { key:'empathy',  label:'공감 표현', color:'#f59e0b', angle: -Math.PI/2 },
    { key:'solution', label:'해결 방향', color:'#3b82f6', angle:  0          },
    { key:'fact',     label:'사실 기반', color:'#22c55e', angle:  Math.PI/2  },
    { key:'followup', label:'후속 약속', color:'#a78bfa', angle:  Math.PI    },
  ];
  var svg = '';

  // 배경 격자 (25% 단위)
  [0.25, 0.5, 0.75, 1.0].forEach(function(ratio) {
    var r = R * ratio;
    var pts = axes.map(function(ax) {
      return (r * Math.cos(ax.angle)).toFixed(2) + ',' + (r * Math.sin(ax.angle)).toFixed(2);
    }).join(' ');
    svg += '<polygon points="' + pts + '" fill="none" stroke="rgba(51,65,85,.55)" stroke-width="1"/>';
    if (ratio < 1) {
      svg += '<text x="3" y="' + (-r + 3).toFixed(1) + '" font-size="8" fill="rgba(130,148,167,.6)" font-family="sans-serif">' + Math.round(ratio * 100) + '%</text>';
    }
  });

  // 축 선
  axes.forEach(function(ax) {
    svg += '<line x1="0" y1="0" x2="' + (R * Math.cos(ax.angle)).toFixed(2) + '" y2="' + (R * Math.sin(ax.angle)).toFixed(2) + '" stroke="rgba(51,65,85,.7)" stroke-width="1"/>';
  });

  // 데이터 폴리곤
  var dataPts = axes.map(function(ax) {
    var v = Math.min(100, Math.max(0, scores[ax.key] || 0));
    var r = (v / 100) * R;
    return (r * Math.cos(ax.angle)).toFixed(2) + ',' + (r * Math.sin(ax.angle)).toFixed(2);
  }).join(' ');
  svg += '<polygon points="' + dataPts + '" fill="rgba(99,102,241,.22)" stroke="#6366f1" stroke-width="2" stroke-linejoin="round"/>';

  // 데이터 포인트 + 레이블
  axes.forEach(function(ax) {
    var v = Math.min(100, Math.max(0, scores[ax.key] || 0));
    var r = (v / 100) * R;
    var px = (r * Math.cos(ax.angle)).toFixed(2);
    var py = (r * Math.sin(ax.angle)).toFixed(2);

    // 포인트
    svg += '<circle cx="' + px + '" cy="' + py + '" r="4.5" fill="' + ax.color + '" stroke="#0f172a" stroke-width="1.5"/>';

    // 레이블 위치 (축 끝 + 여백)
    var lr = R + 24;
    var lx = lr * Math.cos(ax.angle);
    var ly = lr * Math.sin(ax.angle);
    var anchor = Math.abs(Math.cos(ax.angle)) < 0.15 ? 'middle' : (Math.cos(ax.angle) > 0 ? 'start' : 'end');
    var baselineShift = Math.sin(ax.angle) < -0.5 ? -6 : 4;

    svg += '<text x="' + lx.toFixed(1) + '" y="' + (ly + baselineShift).toFixed(1) + '" text-anchor="' + anchor + '" font-size="13" fill="#94a3b8" font-family="sans-serif">' + ax.label + '</text>';
    svg += '<text x="' + lx.toFixed(1) + '" y="' + (ly + baselineShift + 13).toFixed(1) + '" text-anchor="' + anchor + '" font-size="13" fill="' + ax.color + '" font-weight="700" font-family="sans-serif">' + v + '%</text>';
  });

  var el = document.getElementById('radar-svg');
  if (el) el.innerHTML = svg;
}

function showEndScreen() {
  state.phase = 'complete';

  // 입력 영역 및 학부모 현재 말풍선 숨기기
  $('teacher-input-wrap').style.display = 'none';
  $('eval-panel').style.display         = 'none';
  $('model-panel').style.display        = 'none';
  $('next-btn').style.display           = 'none';
  $('teacher-bubble').style.display     = 'none';

  // 현재 학부모 발화도 히스토리로 이동 (마지막 미응답 발화 처리)
  const currentParentEl = $('parent-message');
  const currentParentMsg = currentParentEl.textContent;
  const alreadyLogged = state.turnHistory.some(h => h.parentMsg === currentParentMsg);
  if (!alreadyLogged && state.turnIndex < state.totalTurns) {
    // 입력 없이 평가받기를 누른 경우 현재 발화는 0점 처리
  }

  const avg = state.allScores.length
    ? Math.round(state.allScores.reduce((a, b) => a + b, 0) / state.allScores.length)
    : 0;

  const tColor = avg >= 80 ? 'var(--green)' : avg >= 60 ? 'var(--blue)' : avg >= 40 ? 'var(--yellow)' : 'var(--red)';
  const tHex   = avg >= 80 ? '#22c55e'  : avg >= 60 ? '#3b82f6'  : avg >= 40 ? '#f59e0b'  : '#ef4444';
  const tEmoji = avg >= 80 ? '🌟' : avg >= 60 ? '👍' : avg >= 40 ? '📚' : '💪';
  const tLabel = avg >= 80 ? '탁월한 상담' : avg >= 60 ? '양호한 상담' : avg >= 40 ? '개선 필요' : '성장 중';

  setText('end-emoji',   tEmoji);
  setText('end-score',   avg + '점');
  setText('end-summary', state.scenario.teachingPoint);

  const rgba  = {
    'var(--green)':  'rgba(34,197,94,',
    'var(--blue)':   'rgba(59,130,246,',
    'var(--yellow)': 'rgba(245,158,11,',
    'var(--red)':    'rgba(239,68,68,',
  }[tColor] || 'rgba(99,102,241,';
  const badge = $('end-label-badge');
  badge.style.background  = rgba + '0.12)';
  badge.style.borderColor = rgba + '0.35)';
  badge.style.color       = tColor;
  badge.textContent       = tLabel;
  $('end-score').style.color = tColor;

  // ── 레이더 차트 (항목별 평균) ─────────────────────
  var catTotals = { empathy: 0, solution: 0, fact: 0, followup: 0 };
  var catCount  = state.turnHistory.length;
  if (catCount > 0) {
    state.turnHistory.forEach(function(h) {
      var cats = evaluateCategories(h.teacherInput || '');
      Object.keys(catTotals).forEach(function(k) { catTotals[k] += cats[k]; });
    });
    Object.keys(catTotals).forEach(function(k) { catTotals[k] = Math.round(catTotals[k] / catCount); });
  }
  drawRadarChart(catTotals);

  // ── 턴별 점수 + 모범 답변 비교 ───────────────────
  const completedTurns = state.allScores.length;

  // 차트
  $('end-turn-chart').innerHTML = state.allScores.map((s, i) => {
    const c = s >= 70 ? '#22c55e' : s >= 40 ? '#f59e0b' : '#ef4444';
    const h = Math.max(6, (s / 100) * 48);
    return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;max-width:52px">
      <span style="font-size: 13px;font-weight:800;color:${c}">${s}</span>
      <div style="width:100%;height:${h}px;background:${c};border-radius:3px;opacity:.85"></div>
      <span style="font-size: 12px;color:var(--txt3)">${i+1}회</span>
    </div>`;
  }).join('');

  // ── 턴별 상세 리뷰 ──────────────────────────────
  const modelSection = $('end-model-section');
  if (modelSection) {
    modelSection.innerHTML = '<div style="font-size: 14px;font-weight:700;color:#a5b4fc;margin-bottom:16px">💬 대화별 상세 분석</div>' +
      state.turnHistory.map(function(h, i) {
        var turn  = state.scenario.turns[i];
        if (!turn) return '';
        var sc    = h.score;
        var scCol = sc >= 70 ? '#22c55e' : sc >= 40 ? '#f59e0b' : '#ef4444';

        /* ── 루브릭 breakdown 계산 ── */
        var breakdown = [];
        var lengthBonus = (h.teacherInput && h.teacherInput.length >= 60) ? 5 : 0;
        for (var ri = 0; ri < RUBRIC.length; ri++) {
          var cfg = RUBRIC[ri];
          var hitWords = [];
          for (var wi = 0; wi < cfg.words.length; wi++) {
            if (h.teacherInput && h.teacherInput.includes(cfg.words[wi])) hitWords.push(cfg.words[wi]);
          }
          var pts = cfg.penalty
            ? hitWords.length * cfg.perHit
            : Math.min(cfg.max, hitWords.length * cfg.perHit);
          breakdown.push({ key: cfg.key, label: cfg.label, icon: cfg.icon,
            max: cfg.penalty ? 0 : cfg.max, earned: pts,
            hitWords: hitWords.slice(0,4), penalty: !!cfg.penalty });
        }

        var html = '<div style="margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border2)">';

        /* ① 헤더 */
        html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
        html += '<span style="font-size: 15px;font-weight:800;color:var(--txt)">' + (i+1) + '번째 대화</span>';
        html += '<span style="font-size: 15px;font-weight:800;color:' + scCol + ';background:' + scCol + '18;border:1px solid ' + scCol + '40;padding:2px 10px;border-radius:10px">' + sc + '점</span>';
        html += '</div>';

        /* ② 학부모 발화 */
        html += '<div style="font-size: 13px;font-weight:700;color:#94a3b8;margin-bottom:4px">👩 학부모</div>';
        html += '<div style="font-size: 15px;color:var(--txt2);padding:9px 13px;background:rgba(30,41,59,.7);border-radius:10px 10px 10px 3px;margin-bottom:10px;line-height:1.7">' + escHtml(h.parentMsg) + '</div>';

        /* ③ 모범 답변 */
        html += '<div style="font-size: 13px;font-weight:700;color:#c4b5fd;margin-bottom:4px">💬 모범 답변</div>';
        html += '<div style="font-size: 15px;color:#e2e8f0;padding:9px 13px;background:rgba(99,102,241,.1);border-left:3px solid #6366f1;border-radius:0 10px 10px 0;margin-bottom:10px;line-height:1.7">' + escHtml(turn.modelAnswer) + '</div>';

        /* ④ 내 답변 */
        html += '<div style="font-size: 13px;font-weight:700;color:#93c5fd;margin-bottom:4px">🧑‍🏫 내 답변</div>';
        html += '<div style="font-size: 15px;color:#e2e8f0;padding:9px 13px;background:rgba(59,130,246,.08);border-left:3px solid #3b82f6;border-radius:0 10px 10px 0;margin-bottom:12px;line-height:1.7">' + escHtml(h.teacherInput || '') + '</div>';

        /* ⑤ 피드백 breakdown */
        html += '<div style="border:1px solid #334155;border-radius:10px;overflow:hidden;font-size: 15px">';
        for (var bi = 0; bi < breakdown.length; bi++) {
          var c = breakdown[bi];
          if (c.penalty) continue;
          var d = RD[c.key]; if (!d) continue;
          var ratio = c.max > 0 ? c.earned / c.max : 0;
          var col  = ratio >= 1 ? '#22c55e' : ratio > 0 ? '#f59e0b' : '#ef4444';
          var sIcon = ratio >= 1 ? '✅' : ratio > 0 ? '🟡' : '❌';
          var msg  = ratio >= 1 ? d.ok : ratio > 0 ? d.half : d.no;
          var bg   = ratio >= 1 ? 'rgba(34,197,94,.05)' : ratio > 0 ? 'rgba(245,158,11,.05)' : 'rgba(239,68,68,.05)';
          html += '<div style="padding:10px 14px;background:' + bg + ';border-bottom:1px solid #1e293b">';
          html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">';
          html += '<div style="display:flex;align-items:center;gap:5px"><span>' + (c.icon||'') + '</span><b style="color:' + col + '">' + escHtml(c.label) + '</b><span style="font-size: 13px;color:#8294a7">' + escHtml(d.p) + '</span></div>';
          html += '<span style="font-size: 13px;font-weight:800;color:' + col + ';background:' + col + '22;padding:2px 8px;border-radius:8px">' + sIcon + ' ' + c.earned + '/' + c.max + '점</span>';
          html += '</div>';
          if (c.hitWords && c.hitWords.length > 0) {
            html += '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px">';
            html += '<span style="font-size: 13px;color:#4ade80;font-weight:600">✓ 포함:</span>';
            c.hitWords.forEach(function(w) {
              html += '<span style="font-size: 13px;color:#4ade80;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:5px;padding:1px 6px">' + escHtml(w) + '</span>';
            });
            html += '</div>';
          }
          html += '<div style="font-size: 14px;padding:6px 10px;border-radius:6px;border-left:3px solid ' + col + ';background:' + col + '11;line-height:1.6">';
          html += '<span style="color:' + col + ';font-weight:600">' + escHtml(msg) + '</span>';
          if (ratio < 1) html += '<div style="color:#94a3b8;margin-top:2px">' + escHtml(d.tip) + '</div>';
          html += '</div></div>';
        }
        /* 방어적 감점 */
        breakdown.forEach(function(pc) {
          if (pc.penalty && pc.hitWords && pc.hitWords.length > 0) {
            html += '<div style="padding:8px 14px;background:rgba(239,68,68,.06);border-top:1px solid #1e293b;font-size: 14px;color:#f87171">';
            html += '⚠️ <b>방어적 표현 감점:</b> \"' + escHtml(pc.hitWords.join('", "')) + '\" — 방어적 표현은 학부모 감정을 악화시킵니다.';
            html += '</div>';
          }
        });
        if (lengthBonus) {
          html += '<div style="padding:7px 14px;background:rgba(99,102,241,.05);border-top:1px solid #1e293b;font-size: 14px;color:#a5b4fc">⭐ 성실도 보너스 +5점 — 충분한 길이의 답변이에요!</div>';
        }
        /* 팁 */
        if (turn.tip) {
          html += '<div style="padding:8px 14px;background:#0a1628;border-top:1px solid #334155;font-size: 14px;color:#8294a7;line-height:1.55">' + escHtml(turn.tip) + '</div>';
        }
        html += '</div>';  /* /breakdown box */
        html += '</div>';  /* /turn block */
        return html;
      }).join('');
  }

  // 강점 / 개선점
  const sc2 = state.scenario;
  if (sc2.strengths?.length) {
    $('end-strengths-list').innerHTML = sc2.strengths.map(s => `<li>${s}</li>`).join('');
    $('end-strengths-section').style.display = 'block';
  } else { $('end-strengths-section').style.display = 'none'; }

  if (sc2.improvements?.length) {
    $('end-improvements-list').innerHTML = sc2.improvements.map(s => `<li>${s}</li>`).join('');
    $('end-improvements-section').style.display = 'block';
  } else { $('end-improvements-section').style.display = 'none'; }

  const doneOf = `${completedTurns}/${state.totalTurns}회 대화`;
  setText('end-next-practice',
    `${doneOf} 완료, 평균 ${avg}점. ` +
    (avg >= 70
      ? '훌륭합니다! 다음 단계 시나리오에 도전해보세요.'
      : '공감 표현(💛)과 후속 약속(📅)을 집중 연습해보세요.')
  );

  const es = $('end-screen');
  es.style.display = 'block';
  es.classList.remove('anim-pop-in');
  void es.offsetWidth;
  es.classList.add('anim-pop-in');
  setTimeout(() => es.scrollIntoView({ behavior:'smooth', block:'start' }), 150);

  saveResult(avg, tLabel);
}

/* ════════════════════════════════════════════════════
   재시작
   ════════════════════════════════════════════════════ */
function restartScenario() {
  state.turnIndex    = 0;
  state.emotionLevel = state.scenario.initialEmotion;
  state.phase        = 'input';
  state.turnHistory  = [];
  state.allScores    = [];

  ['end-screen','eval-panel','model-panel','teacher-bubble'].forEach(id => {
    $(id).style.display = 'none';
  });
  $('next-btn').style.display      = 'none';
  $('chat-history-wrap').innerHTML = '';

  // 평가받기 버튼 비활성화
  const btn = $('eval-btn');
  if (btn) {
    btn.style.opacity       = '.5';
    btn.style.pointerEvents = 'none';
  }

  updateEmotionBar(state.emotionLevel, true);
  renderTurn();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ════════════════════════════════════════════════════
   공통 유틸
   ════════════════════════════════════════════════════ */
function updateProgress() {
  const el = $('turn-count');
  if (el) el.textContent = `${state.turnIndex + 1} / ${state.totalTurns}번째 대화`;
}

function updateEmotionBar(level, instant) {
  const hex   = level > 70 ? '#ef4444' : level > 40 ? '#f59e0b' : '#22c55e';
  const color = level > 70 ? 'var(--red)' : level > 40 ? 'var(--yellow)' : 'var(--green)';
  const label = level > 70 ? '격앙' : level > 40 ? '다소 불안' : '안정';

  const fill = $('emotion-fill');
  if (fill) {
    fill.style.transition      = instant ? 'none' : 'width .9s ease, background-color .9s ease';
    fill.style.width           = level + '%';
    fill.style.backgroundColor = hex;
  }
  const lEl = $('emotion-label');
  if (lEl) { lEl.textContent = label; lEl.style.color = color; }
  const vEl = $('emotion-value');
  if (vEl) { vEl.textContent = level; vEl.style.color = color; }
}

function setText(id, text) { const e = $(id); if (e) e.textContent = text; }

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function saveResult(score, label) {
  try {
    const h = JSON.parse(localStorage.getItem('ct_history') || '[]');
    h.push({ scenarioId: state.scenario.id, title: state.scenario.title,
             score, label, date: new Date().toLocaleDateString('ko-KR'), timestamp: Date.now() });
    localStorage.setItem('ct_history', JSON.stringify(h));
  } catch {}
}

function showError(msg) {
  document.body.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;
                min-height:100vh;flex-direction:column;gap:16px">
      <p style="color:var(--txt2)">${escHtml(msg)}</p>
      <a href="index.html" class="btn btn--ghost">← 홈으로</a>
    </div>`;
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
